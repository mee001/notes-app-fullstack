apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
      - name: backend
        image: dockmee001/notes-app-backend:v1
        ports: [{ containerPort: 3000 }]
        env:
        - name: MONGO_URL
          valueFrom: { secretKeyRef: { name: mongo-secret, key: mongo-url } }
---
apiVersion: v1
kind: Service
metadata: { name: backend-service }
spec:
  selector: { app: backend }
  ports: [{ port: 3000 }]

