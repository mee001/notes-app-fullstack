<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes - mlinx Docker App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui, -apple-system, sans-serif;
  background:#0f172a;
  color:#f1f5f9;
  min-height:100vh;
  padding:30px 20px;
}
.container{max-width:700px;margin:0 auto}
h1{font-size:32px;margin-bottom:8px}
.subtitle{color:#94a3b8;margin-bottom:25px}
textarea{
  width:100%;height:120px;
  background:#1e293b;color:white;
  border:1px solid #334155;border-radius:12px;
  padding:14px;font-size:16px;resize:none;
}
textarea:focus{outline:none;border-color:#38bdf8}
.btn-row{margin:15px 0}
button{
  padding:11px 22px;border:none;border-radius:10px;
  font-weight:600;cursor:pointer;margin-right:8px;
}
.btn-save{background:#38bdf8;color:#0f172a}
.btn-clear{background:#1e293b;color:#fb7185;border:1px solid #334155}
.btn-save:hover{background:#7dd3fc}
#notes{margin-top:25px;text-align:left}
.note{
  background:#1e293b;border:1px solid #334155;
  padding:14px 16px;margin-bottom:12px;
  border-radius:10px;display:flex;justify-content:space-between;
}
.note span{color:#94a3b8;font-size:12px}
.footer{margin-top:40px;color:#475569;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>📝 My Docker Notes</h1>
<p class="subtitle">Project 2 - Deployed with Docker + Nginx</p>

<textarea id="input" placeholder="Write something amazing..."></textarea>
<div class="btn-row">
<button class="btn-save" onclick="addNote()">Save Note</button>
<button class="btn-clear" onclick="clearAll()">Clear All</button>
</div>

<div id="notes"></div>
<p class="footer">Built by mlinx | Running inside Docker container 🚀</p>
</div>

<script>
function loadNotes(){
  let notes = JSON.parse(localStorage.getItem('myNotes') || '[]');
  let html = notes.map((t,i)=>`<div class="note"><div>${i+1}. ${t}</div><span>#${i+1}</span></div>`).join('');
  document.getElementById('notes').innerHTML = html || '<p style="color:#475569;text-align:center;margin-top:20px">No notes yet. Start writing!</p>';
}
function addNote(){
  let val = document.getElementById('input').value.trim();
  if(!val) return;
  let notes = JSON.parse(localStorage.getItem('myNotes') || '[]');
  notes.push(val);
  localStorage.setItem('myNotes', JSON.stringify(notes));
  document.getElementById('input').value='';
  loadNotes();
}
function clearAll(){
  if(confirm('Clear all notes?')){
    localStorage.removeItem('myNotes');
    loadNotes();
  }
}
loadNotes();
</script>
</body>
</html>
